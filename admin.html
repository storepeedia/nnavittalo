<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NNA VITTALO - Admin Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Quill Rich Text Editor -->
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .hidden {
        display: none !important;
      }
      .spinner {
        border: 4px solid rgba(0, 0, 0, 0.1);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border-left-color: #2563eb;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen text-gray-800">
    <!-- Login View -->
    <div id="loginView" class="flex items-center justify-center min-h-screen">
      <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-900">
          Admin Login
        </h2>
        <div
          id="loginError"
          class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm relative"
          role="alert"
        ></div>
        <form id="loginForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input
              type="email"
              id="loginEmail"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700"
              >Password</label
            >

            <div class="relative">
              <input
                type="password"
                id="loginPassword"
                class="mt-1 block w-full px-3 py-2 pr-10 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500 hover:text-gray-700"
                style="top: 4px"
                onclick="
                  const passInput = document.getElementById('loginPassword');
                  if (passInput.type === 'password') {
                    passInput.type = 'text';
                    this.innerHTML = '🙈';
                  } else {
                    passInput.type = 'password';
                    this.innerHTML = '👁️';
                  }
                "
              >
                👁️
              </button>
            </div>
          </div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
          >
            Sign In
          </button>
        </form>
      </div>
    </div>

    <!-- Main Dashboard View -->
    <div id="dashboardView" class="hidden">
      <!-- Sidebar/Nav -->
      <nav class="bg-blue-900 text-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex items-center justify-between h-16">
            <div class="flex items-center">
              <span class="font-bold text-xl">NNA VITTALO Admin</span>
              <div class="ml-10 flex items-baseline space-x-4">
                <button
                  id="navPackages"
                  class="bg-blue-800 text-white px-3 py-2 rounded-md text-sm font-medium"
                >
                  Packages
                </button>
                <button
                  id="navBookings"
                  class="text-blue-100 hover:bg-blue-700 hover:text-white px-3 py-2 rounded-md text-sm font-medium"
                >
                  Bookings
                </button>
              </div>
            </div>
            <div>
              <button
                id="btnLogout"
                class="text-blue-100 hover:bg-blue-700 px-3 py-2 rounded-md text-sm font-medium"
              >
                Logout
              </button>
            </div>
          </div>
        </div>
      </nav>

      <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <!-- Packages Section -->
        <div id="sectionPackages">
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">
              Packages Management
            </h2>
            <button
              id="btnCreatePackage"
              class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded"
            >
              + New Package
            </button>
          </div>

          <!-- Loading State -->
          <div id="packagesLoading" class="flex justify-center py-10 hidden">
            <div class="spinner"></div>
          </div>

          <!-- Packages Table -->
          <div class="bg-white shadow overflow-hidden sm:rounded-md">
            <ul id="packagesList" class="divide-y divide-gray-200">
              <!-- Populated by JS -->
            </ul>
          </div>
        </div>

        <!-- Bookings Section -->
        <div id="sectionBookings" class="hidden">
          <h2 class="text-2xl font-bold text-gray-900 mb-6">
            Bookings Dashboard
          </h2>

          <div class="mb-4 flex flex-col gap-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <input
                type="text"
                id="searchBookings"
                placeholder="Search name, email, or ID..."
                class="px-3 py-2 border rounded shadow-sm"
              />
              <select
                id="filterPackage"
                class="px-3 py-2 border rounded shadow-sm"
              >
                <option value="">All Packages</option>
              </select>
              <select
                id="filterStatus"
                class="px-3 py-2 border rounded shadow-sm"
              >
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="paid">Paid</option>
                <option value="failed">Failed</option>
                <option value="refunded">Refunded</option>
              </select>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="flex flex-col">
                <label for="filterBookingDateStart" class="text-xs text-gray-600 mb-1">Booking Date Start</label>
                <input type="date" id="filterBookingDateStart" class="px-3 py-2 border rounded shadow-sm" />
              </div>
              <div class="flex flex-col">
                <label for="filterBookingDateEnd" class="text-xs text-gray-600 mb-1">Booking Date End</label>
                <input type="date" id="filterBookingDateEnd" class="px-3 py-2 border rounded shadow-sm" />
              </div>
              <div class="flex flex-col">
                <label for="filterTripDate" class="text-xs text-gray-600 mb-1">Trip Date</label>
                <input type="date" id="filterTripDate" class="px-3 py-2 border rounded shadow-sm" />
              </div>
            </div>
          </div>

          <!-- Loading State -->
          <div id="bookingsLoading" class="flex justify-center py-10 hidden">
            <div class="spinner"></div>
          </div>

          <div class="bg-white shadow overflow-hidden sm:rounded-lg">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
                <tr>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Booking Info
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Customer
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Package
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Total
                  </th>
                  <th
                    class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Status
                  </th>
                  <th
                    class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"
                  >
                    Actions
                  </th>
                </tr>
              </thead>
              <tbody
                id="bookingsTableBody"
                class="bg-white divide-y divide-gray-200"
              >
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Package Modal -->
    <div
      id="packageModal"
      class="fixed z-10 inset-0 overflow-y-auto hidden"
      aria-labelledby="modal-title"
      role="dialog"
      aria-modal="true"
    >
      <div
        class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0"
      >
        <div
          class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"
          aria-hidden="true"
          onclick="closePackageModal()"
        ></div>
        <span
          class="hidden sm:inline-block sm:align-middle sm:h-screen"
          aria-hidden="true"
          >&#8203;</span
        >
        <div
          class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full"
        >
          <form id="packageForm" class="p-6">
            <input type="hidden" id="pkgId" />
            <h3
              class="text-lg leading-6 font-medium text-gray-900 mb-4"
              id="modal-title"
            >
              Create / Edit Package
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Title (ID for URL)</label
                >
                <input
                  type="text"
                  id="pkgTitleId"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                  required
                  placeholder="e.g. Hiking"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Display Title</label
                >
                <input
                  type="text"
                  id="pkgTitle"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Location</label
                >
                <input
                  type="text"
                  id="pkgLocation"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Emoji</label
                >
                <input
                  type="text"
                  id="pkgEmoji"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Price (PLN)</label
                >
                <input
                  type="number"
                  id="pkgPrice"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                  required
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Price (EUR)</label
                >
                <input
                  type="number"
                  id="pkgPriceEur"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                  step="0.01"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Duration Text</label
                >
                <input
                  type="text"
                  id="pkgDuration"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                  placeholder="e.g. 2 Days / 1 Nights"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Trip Dates (comma separated)</label
                >
                <input
                  type="text"
                  id="pkgTripDate"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                  placeholder="e.g. 18 July 2026, 25 July 2026"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Activity Type</label
                >
                <input
                  type="text"
                  id="pkgActivity"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700"
                  >Priority (Sort order)</label
                >
                <input
                  type="number"
                  id="pkgPriority"
                  class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                  value="0"
                />
              </div>
              <div class="flex items-center space-x-4">
                <label class="flex items-center">
                  <input
                    type="checkbox"
                    id="pkgIsActive"
                    class="rounded text-blue-600 border-gray-300 focus:ring-blue-500"
                    checked
                    onchange="toggleDisableOptions()"
                  />
                  <span class="ml-2 text-sm text-gray-700">Is Active</span>
                </label>
                <label
                  class="flex items-center hidden"
                  id="hideWhenDisabledContainer"
                >
                  <input
                    type="checkbox"
                    id="pkgHideWhenDisabled"
                    class="rounded text-blue-600 border-gray-300 focus:ring-blue-500"
                  />
                  <span class="ml-2 text-sm text-gray-700"
                    >Hide from homepage entirely</span
                  >
                </label>
              </div>
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700"
                >Images (URLs, one per line)</label
              >
              <textarea
                id="pkgImages"
                rows="3"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
                placeholder="https://example.com/image1.jpg"
              ></textarea>
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700"
                >Description</label
              >
              <textarea
                id="pkgDesc"
                rows="3"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
              ></textarea>
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Itinerary (Rich Text)</label
              >
              <div id="editor-container" class="h-64 border rounded"></div>
            </div>

            <div class="mt-5 sm:mt-6 sm:flex sm:flex-row-reverse">
              <button
                type="submit"
                class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm"
              >
                Save
              </button>
              <button
                type="button"
                onclick="closePackageModal()"
                class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:w-auto sm:text-sm"
              >
                Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Bookings View Modal -->
    <div
      id="bookingModal"
      class="fixed z-10 inset-0 overflow-y-auto hidden"
      aria-labelledby="modal-title"
      role="dialog"
      aria-modal="true"
    >
      <div
        class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0"
      >
        <div
          class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"
          aria-hidden="true"
          onclick="closeBookingModal()"
        ></div>
        <span
          class="hidden sm:inline-block sm:align-middle sm:h-screen"
          aria-hidden="true"
          >&#8203;</span
        >
        <div
          class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full"
        >
          <div class="p-6">
            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">
              Booking Details
            </h3>
            <div id="bookingDetailsContent" class="space-y-4">
              <!-- Populated by JS -->
            </div>
            <div class="mt-4 border-t pt-4">
              <label class="block text-sm font-medium text-gray-700"
                >Update Status</label
              >
              <select
                id="bookingStatusUpdate"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md"
              >
                <option value="pending">Pending</option>
                <option value="paid">Paid</option>
                <option value="failed">Failed</option>
                <option value="refunded">Refunded</option>
              </select>
            </div>
            <div class="mt-5 sm:mt-6 sm:flex sm:flex-row-reverse">
              <button
                type="button"
                id="btnUpdateBookingStatus"
                class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm"
              >
                Save Status
              </button>
              <button
                type="button"
                onclick="closeBookingModal()"
                class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:w-auto sm:text-sm"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const supabaseUrl = "https://ghwmmkiynmnunotwnenj.supabase.co";
      const supabaseKey =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdod21ta2l5bm1udW5vdHduZW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NzkxMjEsImV4cCI6MjA5MDU1NTEyMX0.gC5tdWEciwZbF_1FzmD16V7JX66N7nHJ-G00C4gyG_0";
      const dbClient = window.supabase.createClient(supabaseUrl, supabaseKey);

      let quill;
      let currentPackages = [];
      let currentBookings = [];
      let selectedBookingId = null;

      // Init Quill
      document.addEventListener("DOMContentLoaded", () => {
        quill = new Quill("#editor-container", {
          theme: "snow",
          modules: {
            toolbar: [
              [{ header: [1, 2, 3, false] }],
              ["bold", "italic", "underline"],
              [{ list: "ordered" }, { list: "bullet" }],
              ["clean"],
            ],
          },
        });

        checkSession();
      });

      // ------------------
      // Auth Logic
      // ------------------
      dbClient.auth.onAuthStateChange((event, session) => {
        if (session) {
          document.getElementById("loginView").classList.add("hidden");
          document.getElementById("dashboardView").classList.remove("hidden");
          loadPackages();
        } else {
          document.getElementById("loginView").classList.remove("hidden");
          document.getElementById("dashboardView").classList.add("hidden");
        }
      });

      async function checkSession() {
        const {
          data: { session },
        } = await dbClient.auth.getSession();
        if (session) {
          document.getElementById("loginView").classList.add("hidden");
          document.getElementById("dashboardView").classList.remove("hidden");
          loadPackages();
        }
      }

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;
          const errDiv = document.getElementById("loginError");
          errDiv.classList.add("hidden");

          const { data, error } = await dbClient.auth.signInWithPassword({
            email,
            password,
          });
          if (error) {
            errDiv.textContent = error.message;
            errDiv.classList.remove("hidden");
          } else {
            // force update ui in case onAuthStateChange is slow or misses
            document.getElementById("loginView").classList.add("hidden");
            document.getElementById("dashboardView").classList.remove("hidden");
            loadPackages();
          }
        });

      document
        .getElementById("btnLogout")
        .addEventListener("click", async () => {
          await dbClient.auth.signOut();
        });

      // ------------------
      // Navigation Logic
      // ------------------
      document.getElementById("navPackages").addEventListener("click", () => {
        document.getElementById("sectionPackages").classList.remove("hidden");
        document.getElementById("sectionBookings").classList.add("hidden");
        document
          .getElementById("navPackages")
          .classList.replace("text-blue-100", "bg-blue-800");
        document.getElementById("navPackages").classList.add("text-white");
        document
          .getElementById("navBookings")
          .classList.replace("bg-blue-800", "text-blue-100");
        document.getElementById("navBookings").classList.remove("text-white");
        loadPackages();
      });

      document.getElementById("navBookings").addEventListener("click", () => {
        document.getElementById("sectionBookings").classList.remove("hidden");
        document.getElementById("sectionPackages").classList.add("hidden");
        document
          .getElementById("navBookings")
          .classList.replace("text-blue-100", "bg-blue-800");
        document.getElementById("navBookings").classList.add("text-white");
        document
          .getElementById("navPackages")
          .classList.replace("bg-blue-800", "text-blue-100");
        document.getElementById("navPackages").classList.remove("text-white");
        loadBookings();
      });

      // ------------------
      // Package Management
      // ------------------
      async function loadPackages() {
        document.getElementById("packagesLoading").classList.remove("hidden");
        const { data, error } = await dbClient
          .from("packages")
          .select("*")
          .order("priority", { ascending: false });
        document.getElementById("packagesLoading").classList.add("hidden");
        if (error) return console.error(error);

        currentPackages = data;

        // Populate bookings filter
        const filterPkg = document.getElementById("filterPackage");
        filterPkg.innerHTML =
          '<option value="">All Packages</option>' +
          data
            .map((p) => `<option value="${p.id}">${p.title}</option>`)
            .join("");

        renderPackagesList();
      }

      function renderPackagesList() {
        const list = document.getElementById("packagesList");
        list.innerHTML = currentPackages
          .map(
            (pkg) => `
                <li class="px-6 py-4 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        ${pkg.photo ? `<img src="${pkg.photo}" class="w-16 h-16 object-cover rounded">` : `<div class="w-16 h-16 bg-gray-200 rounded"></div>`}
                        <div>
                            <h3 class="text-lg font-medium text-gray-900">${pkg.title}</h3>
                            <p class="text-sm text-gray-500">${pkg.location || ""} • Priority: ${pkg.priority}</p>
                            <div class="mt-1">
                                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${pkg.is_active ? "bg-green-100 text-green-800" : "bg-gray-100 text-gray-800"}">
                                    ${pkg.is_active ? "Active" : "Disabled"}
                                </span>
                                ${!pkg.is_active && pkg.hide_when_disabled ? '<span class="ml-2 px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Hidden from Home</span>' : ""}
                            </div>
                        </div>
                    </div>

                    <div class="flex space-x-3">
                        <button onclick="openPackageModal('${pkg.id}')" class="text-blue-600 hover:text-blue-900 font-medium">Edit</button>
                        <button onclick="duplicatePackage('${pkg.id}')" class="text-green-600 hover:text-green-900 font-medium">Duplicate</button>
                        <button onclick="deletePackage('${pkg.id}')" class="text-red-600 hover:text-red-900 font-medium">Delete</button>
                    </div>

                </li>
            `,
          )
          .join("");
      }

      function toggleDisableOptions() {
        const isActive = document.getElementById("pkgIsActive").checked;
        const hideContainer = document.getElementById(
          "hideWhenDisabledContainer",
        );
        if (isActive) {
          hideContainer.classList.add("hidden");
          document.getElementById("pkgHideWhenDisabled").checked = false;
        } else {
          hideContainer.classList.remove("hidden");
        }
      }

      document
        .getElementById("btnCreatePackage")
        .addEventListener("click", () => {
          document.getElementById("packageForm").reset();
          document.getElementById("pkgId").value = "";
          document.getElementById("pkgTitleId").readOnly = false;
          quill.root.innerHTML = "";
          toggleDisableOptions();
          document.getElementById("packageModal").classList.remove("hidden");
        });


      function openPackageModal(id) {
        const pkg = currentPackages.find((p) => p.id === id);
        if (!pkg) return;

        document.getElementById("pkgId").value = pkg.id;
        document.getElementById("pkgTitleId").value = pkg.id;
        document.getElementById("pkgTitleId").readOnly = true; // Don't let them change ID easily if edit
        document.getElementById("pkgTitle").value = pkg.title;
        document.getElementById("pkgLocation").value = pkg.location || "";
        document.getElementById("pkgEmoji").value = pkg.emoji || "";
        document.getElementById("pkgPrice").value = pkg.price || "";
        document.getElementById("pkgPriceEur").value = pkg.price_eur || "";
        document.getElementById("pkgDuration").value = pkg.duration || "";
        document.getElementById("pkgTripDate").value = pkg.trip_date || "";
        document.getElementById("pkgActivity").value = pkg.activity || "";
        document.getElementById("pkgPriority").value = pkg.priority || 0;
        document.getElementById("pkgDesc").value = pkg.desc_text || "";
        document.getElementById("pkgImages").value = (pkg.images || []).join(
          "\n",
        );

        document.getElementById("pkgIsActive").checked =
          pkg.is_active !== false; // default true
        document.getElementById("pkgHideWhenDisabled").checked =
          pkg.hide_when_disabled === true;

        toggleDisableOptions();

        quill.root.innerHTML = pkg.itinerary_text || "";
        document.getElementById("packageModal").classList.remove("hidden");
      }

      function duplicatePackage(id) {
        const pkg = currentPackages.find((p) => p.id === id);
        if (!pkg) return;

        // Open modal as if it's a new package, but prepopulated
        document.getElementById("pkgId").value = "";
        document.getElementById("pkgTitleId").value = "";
        document.getElementById("pkgTitleId").readOnly = false;
        document.getElementById("pkgTitle").value = "Copy of " + pkg.title;
        document.getElementById("pkgLocation").value = pkg.location || "";
        document.getElementById("pkgEmoji").value = pkg.emoji || "";
        document.getElementById("pkgPrice").value = pkg.price || "";
        document.getElementById("pkgPriceEur").value = pkg.price_eur || "";
        document.getElementById("pkgDuration").value = pkg.duration || "";
        document.getElementById("pkgTripDate").value = pkg.trip_date || "";
        document.getElementById("pkgActivity").value = pkg.activity || "";
        document.getElementById("pkgPriority").value = pkg.priority || 0;
        document.getElementById("pkgDesc").value = pkg.desc_text || "";
        document.getElementById("pkgImages").value = (pkg.images || []).join(
          "\n",
        );

        document.getElementById("pkgIsActive").checked =
          pkg.is_active !== false;
        document.getElementById("pkgHideWhenDisabled").checked =
          pkg.hide_when_disabled === true;

        toggleDisableOptions();

        quill.root.innerHTML = pkg.itinerary_text || "";
        document.getElementById("packageModal").classList.remove("hidden");
      }

      async function deletePackage(id) {
        if (confirm("Are you sure you want to completely remove this package?")) {
            const { error } = await dbClient.from("packages").delete().eq("id", id);
            if (error) {
                alert("Error deleting package: " + error.message);
            } else {
                loadPackages();
            }
        }
      }

      function closePackageModal() {
        document.getElementById("packageModal").classList.add("hidden");
      }

      document
        .getElementById("packageForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const id = document.getElementById("pkgTitleId").value;
          const imagesText = document.getElementById("pkgImages").value;
          const images = imagesText
            .split("\n")
            .map((i) => i.trim())
            .filter((i) => i.length > 0);

          const payload = {
            id: id,
            title: document.getElementById("pkgTitle").value,
            location: document.getElementById("pkgLocation").value,
            emoji: document.getElementById("pkgEmoji").value,
            price: parseFloat(document.getElementById("pkgPrice").value),
            price_eur: document.getElementById("pkgPriceEur").value
              ? parseFloat(document.getElementById("pkgPriceEur").value)
              : null,
            duration: document.getElementById("pkgDuration").value,
            trip_date: document.getElementById("pkgTripDate").value,
            activity: document.getElementById("pkgActivity").value,
            priority:
              parseInt(document.getElementById("pkgPriority").value) || 0,
            desc_text: document.getElementById("pkgDesc").value,
            images: images,
            photo: images.length > 0 ? images[0] : null,
            itinerary_text: quill.root.innerHTML,
            is_active: document.getElementById("pkgIsActive").checked,
            hide_when_disabled: document.getElementById("pkgHideWhenDisabled")
              .checked,
          };

          const { error } = await dbClient.from("packages").upsert(payload);
          if (error) {
            alert("Error saving package: " + error.message);
          } else {
            closePackageModal();
            loadPackages();
          }
        });

      // ------------------
      // Bookings Dashboard
      // ------------------
      async function loadBookings() {
        document.getElementById("bookingsLoading").classList.remove("hidden");
        let query = dbClient
          .from("bookings")
          .select("*")
          .order("created_at", { ascending: false });

        const { data, error } = await query;
        document.getElementById("bookingsLoading").classList.add("hidden");
        if (error) return console.error(error);

        currentBookings = data;
        renderBookingsList();
      }

      function renderBookingsList() {
        const search = document
          .getElementById("searchBookings")
          .value.toLowerCase();
        const filterPkg = document.getElementById("filterPackage").value;
        const filterStatus = document.getElementById("filterStatus").value;
        const filterBookingStart = document.getElementById("filterBookingDateStart").value;
        const filterBookingEnd = document.getElementById("filterBookingDateEnd").value;
        const filterTripDate = document.getElementById("filterTripDate").value;

        const filtered = currentBookings.filter((b) => {
          const matchSearch =
            (b.customer_name || "").toLowerCase().includes(search) ||
            (b.booking_no || "").toLowerCase().includes(search);
          const matchPkg = filterPkg === "" || b.event_id === filterPkg;
          const matchStatus = filterStatus === "" || b.status === filterStatus;

          let matchBookingDate = true;
          if (filterBookingStart || filterBookingEnd) {
            const bDate = new Date(b.created_at);
            // Reset time part for comparison
            bDate.setHours(0, 0, 0, 0);

            if (filterBookingStart) {
                const sDate = new Date(filterBookingStart);
                sDate.setHours(0, 0, 0, 0);
                if (bDate < sDate) matchBookingDate = false;
            }
            if (filterBookingEnd) {
                const eDate = new Date(filterBookingEnd);
                eDate.setHours(0, 0, 0, 0);
                if (bDate > eDate) matchBookingDate = false;
            }
          }

          let matchTripDate = true;
          if (filterTripDate) {
              if (!b.chosen_trip_date) {
                  matchTripDate = false;
              } else {
                  // Assuming chosen_trip_date is stored in a format compatible with Date or YYYY-MM-DD
                  const tDate = new Date(b.chosen_trip_date);
                  tDate.setHours(0, 0, 0, 0);
                  const filterTDate = new Date(filterTripDate);
                  filterTDate.setHours(0, 0, 0, 0);
                  if (tDate.getTime() !== filterTDate.getTime()) {
                      matchTripDate = false;
                  }
              }
          }

          return matchSearch && matchPkg && matchStatus && matchBookingDate && matchTripDate;
        });

        const tbody = document.getElementById("bookingsTableBody");
        tbody.innerHTML = filtered
          .map((b) => {
            let statusColor = "bg-gray-100 text-gray-800";
            if (b.status === "paid")
              statusColor = "bg-green-100 text-green-800";
            if (b.status === "failed") statusColor = "bg-red-100 text-red-800";
            if (b.status === "pending")
              statusColor = "bg-yellow-100 text-yellow-800";

            return `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-medium text-gray-900">${b.booking_no}</div>
                        <div class="text-sm text-gray-500">${new Date(b.created_at).toLocaleDateString()}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${b.customer_name}</div>
                        <div class="text-sm text-gray-500">${b.mobile_no || ""}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm text-gray-900">${b.event_name}</div>
                        <div class="text-sm text-gray-500">${b.is_main_booker ? (b.guests || 1) + " Guests" : "Additional Guest"}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${b.total_price_pln ? b.total_price_pln + " PLN" : "-"}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${statusColor}">
                            ${(b.status || "pending").toUpperCase()}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="openBookingModal('${b.id}')" class="text-blue-600 hover:text-blue-900">View</button>
                    </td>
                </tr>
                `;
          })
          .join("");
      }

      document
        .getElementById("searchBookings")
        .addEventListener("input", renderBookingsList);
      document
        .getElementById("filterPackage")
        .addEventListener("change", renderBookingsList);
      document
        .getElementById("filterStatus")
        .addEventListener("change", renderBookingsList);
      document
        .getElementById("filterBookingDateStart")
        .addEventListener("change", renderBookingsList);
      document
        .getElementById("filterBookingDateEnd")
        .addEventListener("change", renderBookingsList);
      document
        .getElementById("filterTripDate")
        .addEventListener("change", renderBookingsList);

      function openBookingModal(id) {
        const b = currentBookings.find((x) => x.id === id);
        if (!b) return;
        selectedBookingId = b.id;

        document.getElementById("bookingDetailsContent").innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div><span class="text-gray-500 text-sm">Booking Ref:</span><br/><strong>${b.booking_no}</strong></div>
                    <div><span class="text-gray-500 text-sm">Date Created:</span><br/><strong>${new Date(b.created_at).toLocaleString()}</strong></div>
                    <div><span class="text-gray-500 text-sm">Customer:</span><br/><strong>${b.customer_name}</strong></div>
                    <div><span class="text-gray-500 text-sm">Phone:</span><br/><strong>${b.mobile_no || "N/A"}</strong></div>
                    <div><span class="text-gray-500 text-sm">DOB:</span><br/><strong>${b.dob || "N/A"}</strong></div>
                    <div><span class="text-gray-500 text-sm">Package:</span><br/><strong>${b.event_name}</strong></div>
                    <div><span class="text-gray-500 text-sm">Total PLN:</span><br/><strong>${b.total_price_pln || "N/A"}</strong></div>
                    <div><span class="text-gray-500 text-sm">Total EUR:</span><br/><strong>${b.total_price_eur || "N/A"}</strong></div>
                </div>
            `;
        document.getElementById("bookingStatusUpdate").value =
          b.status || "pending";
        document.getElementById("bookingModal").classList.remove("hidden");
      }

      function closeBookingModal() {
        document.getElementById("bookingModal").classList.add("hidden");
        selectedBookingId = null;
      }

      document
        .getElementById("btnUpdateBookingStatus")
        .addEventListener("click", async () => {
          if (!selectedBookingId) return;
          const newStatus = document.getElementById(
            "bookingStatusUpdate",
          ).value;

          const { error } = await dbClient
            .from("bookings")
            .update({ status: newStatus })
            .eq("id", selectedBookingId);
          if (error) {
            alert("Error updating status: " + error.message);
          } else {
            closeBookingModal();
            loadBookings(); // reload data
          }
        });
    </script>
  </body>
</html>
